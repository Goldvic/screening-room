<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Cinema TV</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #000; color: #f3f3f8; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; overflow: hidden; cursor: none; }
      #v { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; object-fit: contain; }
      .screen { position: fixed; inset: 0; display: none; place-content: center; justify-items: center; gap: 2.2vh; text-align: center; padding: 4vh 6vw;
        background: radial-gradient(1200px 700px at 75% -10%, #2b1d4d, transparent 70%), #0b0b11; }
      .screen.on { display: grid; }
      .logo { width: 11vh; height: 11vh; border-radius: 3vh; background: linear-gradient(135deg, #8b5cf6, #ec4899); display: grid; place-items: center; box-shadow: 0 2vh 8vh #8b5cf655; }
      .logo i { border-left: 3.6vh solid #fff; border-top: 2.2vh solid transparent; border-bottom: 2.2vh solid transparent; margin-left: 1vh; }
      h1 { margin: 0; font-size: 5vh; letter-spacing: .01em; }
      p { margin: 0; color: #a0a1b8; font-size: 3vh; line-height: 1.4; max-width: 70vw; }
      .code { font: 800 14vh/1 ui-monospace, 'SF Mono', Consolas, monospace; letter-spacing: .12em; padding: 2.6vh 4vw; border-radius: 3vh; background: #16161f; border: .3vh solid #ffffff22; color: #fff; }
      .qr { background: #fff; padding: 1.4vh; border-radius: 2vh; width: 20vh; height: 20vh; }
      .qr svg { width: 100%; height: 100%; display: block; }
      .row { display: flex; gap: 5vw; align-items: center; justify-content: center; }
      .url { font: 700 3.4vh ui-monospace, Consolas, monospace; color: #c9b8ff; }
      .spin { width: 7vh; height: 7vh; border-radius: 50%; border: .8vh solid #ffffff22; border-top-color: #8b5cf6; animation: sp 1s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 14vh 4vw 4.5vh; background: linear-gradient(transparent, #000c); opacity: 0; transition: opacity .25s; pointer-events: none; }
      #hud.on { opacity: 1; }
      #ttl { font-size: 4.2vh; font-weight: 700; margin-bottom: 1.8vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #bar { height: 1vh; border-radius: 1vh; background: #ffffff30; overflow: hidden; }
      #fill { height: 100%; width: 0; background: linear-gradient(90deg, #8b5cf6, #ec4899); }
      #meta { display: flex; justify-content: space-between; margin-top: 1.4vh; font-size: 2.8vh; color: #d6d7e8; font-variant-numeric: tabular-nums; }
      #toast { position: fixed; top: 4vh; left: 50%; transform: translateX(-50%); padding: 1.4vh 3vw; border-radius: 99px; background: #000b; font-size: 3vh; opacity: 0; transition: opacity .2s; }
      #toast.on { opacity: 1; }
      #buf { position: fixed; inset: 0; display: none; place-items: center; pointer-events: none; }
      #buf.on { display: grid; }
      #conn { position: fixed; top: 3vh; right: 3vw; padding: .8vh 1.6vw; border-radius: 99px; background: #ff7a8a33; color: #ffb3bd; font-size: 2.4vh; display: none; }
      #conn.on { display: block; }
    </style>
  </head>
  <body>
    <video id="v" playsinline></video>

    <div class="screen" id="boot"><div class="spin"></div><p>Starting…</p></div>

    <div class="screen" id="pair">
      <div class="logo"><i></i></div>
      <h1>Connect this TV</h1>
      <div class="row">
        <div class="qr" id="qr"></div>
        <div class="code" id="code">······</div>
      </div>
      <p>On your phone open <span class="url" id="host"></span>, then choose <b>Send to TV</b> and type this code.</p>
    </div>

    <div class="screen" id="ready">
      <div class="logo"><i></i></div>
      <h1 id="rname">Cinema TV</h1>
      <p>Ready. Pick something to watch on your phone and send it here.</p>
    </div>

    <div class="screen" id="fail"><h1>Something went wrong</h1><p id="failmsg"></p></div>

    <div id="buf"><div class="spin"></div></div>
    <div id="conn">Reconnecting…</div>
    <div id="toast"></div>
    <div id="hud"><div id="ttl"></div><div id="bar"><div id="fill"></div></div><div id="meta"><span id="t1">0:00</span><span id="t2">0:00</span></div></div>

    <script type="module" src="/src/tv/tv.ts"></script>
  </body>
</html>
