name: Build Windows installer

# Runs when you:
#   - push to main/master          -> builds the installer, you download it from the Actions tab
#   - push a tag like v1.1.0       -> builds it AND publishes it on the GitHub "Releases" page
#   - click "Run workflow" button  -> builds it on demand (Actions tab)
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed so the tag build can create a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # For a tag like v1.2.0, make the installer's version 1.2.0 (so the in-app updater compares correctly)
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the Windows installer
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no code-signing certificate, skip looking for one

      - name: Save the installers (Actions tab -> this run -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-Windows
          path: |
            release/*.exe
            release/*.msi
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Publish a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.msi
            release/latest.yml
            release/*.blockmap
          generate_release_notes: true