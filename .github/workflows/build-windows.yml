name: Build Windows installers

# Every push to main/master:
#   1. picks the next version automatically (1.1.0, then 1.1.1, 1.1.2, ...)
#   2. builds the EXE (and the dark "Cinema-Installer" window) and the MSI in separate jobs
#   3. creates the tag (v1.1.1 ...) and a release with each file as its own download
# Open the repo's "Releases" page and click the file you want. No zip, no folder.
#   Cinema-Installer-x.exe  the dark installer window (small, downloads the app while it installs)
#   Cinema-Setup-x.exe      the full standard installer (also used by the in-app updater)
#   Cinema-x.msi            for offline or managed installs
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        shell: bash
        run: |
          git fetch --tags --force
          base=$(node -p "require('./package.json').version")
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$latest" ]; then next="$base"
          else
            top=$(printf '%s\n%s\n' "$base" "$latest" | sort -V | tail -1)
            if [ "$top" = "$base" ] && [ "$base" != "$latest" ]; then next="$base"
            else next="${latest%.*}.$(( ${latest##*.} + 1 ))"; fi
          fi
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  exe:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npm install --no-audit --no-fund
      - name: Build the EXE installer
        run: npm run build:app && npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build the dark installer window (optional, never blocks the release)
        continue-on-error: true
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/make-buildinfo.cjs
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /optimize+ /win32icon:build\icon.ico /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "/out:release\Cinema-Installer-$($env:VERSION).exe" installer\CinemaSetup.cs installer\BuildInfo.cs
          if ($LASTEXITCODE -ne 0) { throw 'csc failed' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            release/Cinema-Setup-*.exe
            release/Cinema-Installer-*.exe
            release/*.exe.blockmap
            release/latest.yml

  msi:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npm install --no-audit --no-fund
      - name: Build the MSI installer (branded, with a plain fallback)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build:app
          node scripts/msi-brand.cjs on
          if ! npx electron-builder --win msi --publish never; then
            echo "::warning::The branded MSI failed to build, building the plain one instead"
            node scripts/msi-brand.cjs off
            rm -f release/Cinema-*.msi
            npx electron-builder --win msi --publish never
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release/*.msi