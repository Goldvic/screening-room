name: Build Windows installers

# Every push to main/master:
#   1. picks the next version automatically (1.1.0, then 1.1.1, 1.1.2, ...)
#   2. builds the EXE and the MSI in two separate jobs, with that version inside the app
#   3. creates the tag (v1.1.1 ...) and a release with ONLY the .exe and the .msi as separate downloads
# Open the repo's "Releases" page and click the file you want. No zip, no folder.
# The first version is the "version" in package.json; after that it goes up by 1 on every push.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        shell: bash
        run: |
          git fetch --tags --force
          base=$(node -p "require('./package.json').version")
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$latest" ]; then next="$base"
          else
            top=$(printf '%s\n%s\n' "$base" "$latest" | sort -V | tail -1)
            if [ "$top" = "$base" ] && [ "$base" != "$latest" ]; then next="$base"
            else next="${latest%.*}.$(( ${latest##*.} + 1 ))"; fi
          fi
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  exe:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npm install --no-audit --no-fund
      - name: Build the EXE installer
        run: npm run build:app && npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/latest.yml

  msi:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
        shell: bash
      - run: npm install --no-audit --no-fund
      - name: Build the MSI installer
        run: npm run build:app && npx electron-builder --win msi --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release/*.msi