# Run from the project folder:   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  cinema:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      MEDIA_ROOTS: ${MEDIA_ROOTS}          # for example  Movies=/media/Movies,Shows=/media/Shows
      ACCESS_PIN: ${ACCESS_PIN}            # watch-only code for family, phone and TV
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}    # your own password: the whole app
    volumes:
      - ${MEDIA_DIR}:/media:ro             # your videos, read-only: Cinema can never change or delete them from here
      - cinema-data:/data                  # watch progress, favourites, TV pairings, thumbnails
    expose: ["3001"]

  caddy:                                   # gives you https and a certificate that renews itself
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [cinema]

volumes:
  cinema-data:
  caddy-data:
  caddy-config:
